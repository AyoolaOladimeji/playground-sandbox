<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Classic XI Pro - Team Member Login">
  <title>Classic XI Pro | Login</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-placeholder.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="assets/logo-placeholder.svg" alt="Classic XI Pro Logo">
        <div class="logo-text">
          <span>CLASSIC XI PRO</span>
          <span>Football Club</span>
        </div>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="players.html">Squad</a>
        <a href="gallery.html">Gallery</a>
        <a href="videos.html">Videos</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="sponsors.html">Sponsors</a>
        <a href="login.html" class="btn-login active"><i class="fas fa-user"></i> Login</a>
      </nav>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="players.html">Squad</a>
    <a href="gallery.html">Gallery</a>
    <a href="videos.html">Videos</a>
    <a href="fixtures.html">Fixtures</a>
    <a href="sponsors.html">Sponsors</a>
    <a href="login.html" class="active"><i class="fas fa-user"></i> Login</a>
  </nav>

  <!-- Login Section -->
  <section class="login-section">
    <div class="login-card">
      <img src="assets/logo-placeholder.svg" alt="Classic XI Pro" class="login-logo">
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to manage team content</p>

      <div class="alert alert-error" id="loginError"></div>
      <div class="alert alert-success" id="loginSuccess"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="your@email.com" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <p style="margin-top: 20px; font-size: 0.85rem; color: var(--mid-gray);">
        Team members only. Contact admin for access.
      </p>

      <!-- Dashboard link shown when logged in -->
      <div id="loggedInSection" style="display: none; margin-top: 20px;">
        <p style="color: var(--success); font-weight: 600;"><i class="fas fa-check-circle"></i> You are logged in</p>
        <a href="admin.html" class="btn btn-secondary" style="margin-top: 10px;">
          <i class="fas fa-tachometer-alt"></i> Go to Dashboard
        </a>
        <button class="btn btn-outline" id="logoutBtn" style="margin-top: 10px; color: var(--danger); border-color: var(--danger);">
          <i class="fas fa-sign-out-alt"></i> Log Out
        </button>
      </div>
    </div>
  </section>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
